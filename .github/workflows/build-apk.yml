name: Build MarketForecast PROX 4.8.120 APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: write

env:
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Locate Gradle project
        shell: bash
        run: |
          set -euo pipefail
          if [ -f "settings.gradle.kts" ]; then
            echo "Gradle project is already at repository root."
          else
            ZIP_FILE="$(find . -type f -iname '*.zip' -not -path './.git/*' -not -path './.mfp_unpack/*' -printf '%T@ %p\n' 2>/dev/null | sort -nr | cut -d' ' -f2- | head -n1 || true)"
            test -n "$ZIP_FILE" || { echo 'ERROR: Gradle project/ZIP not found.'; exit 1; }
            rm -rf .mfp_unpack
            mkdir -p .mfp_unpack
            unzip -q "$ZIP_FILE" -d .mfp_unpack
            SETTINGS="$(find .mfp_unpack -type f -name settings.gradle.kts -print -quit || true)"
            test -n "$SETTINGS" || { echo 'ERROR: ZIP does not contain settings.gradle.kts.'; exit 1; }
            PROJECT_ROOT="$(dirname "$SETTINGS")"
            cp -a "$PROJECT_ROOT"/. ./
            rm -rf .mfp_unpack
          fi
          test -f settings.gradle.kts
          test -f app/build.gradle.kts

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # Do not use android-actions/setup-android here. Its package installer can
      # request the obsolete SDK package named "tools" and fail before Gradle.
      # GitHub's runner already contains sdkmanager; use it directly.
      - name: Prepare Android SDK
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          test -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" || {
            echo "ERROR: sdkmanager not found at $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
            find "$ANDROID_HOME/cmdline-tools" -maxdepth 3 -type f -name sdkmanager -print || true
            exit 1
          }
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install "platform-tools" "platforms;android-36" "build-tools;36.0.0"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --list_installed | grep -E 'platform-tools|platforms;android-36|build-tools;36.0.0'

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
          cache-read-only: false

      - name: Verify scanner service architecture
        shell: bash
        run: |
          set -euo pipefail
          test -f app/src/main/java/ScannerForegroundService.kt
          test -f app/src/main/java/ScannerEngine.kt
          test -f app/src/main/AndroidManifest.xml
          grep -q 'ScannerForegroundService' app/src/main/AndroidManifest.xml
          grep -q 'foregroundServiceType="dataSync"' app/src/main/AndroidManifest.xml
          grep -q 'versionCode = 159' app/build.gradle.kts
          grep -q 'versionName = "4.8.120"' app/build.gradle.kts
          grep -q 'TRADING_INSTRUMENT_TYPES' app/src/main/java/MarketRepository.kt
          grep -q 'START_STICKY' app/src/main/java/ScannerForegroundService.kt
          grep -q 'onTaskRemoved' app/src/main/java/ScannerForegroundService.kt
          echo 'Persistent scanner architecture verification: OK'

      - name: Build debug APK
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4g -Dkotlin.daemon.jvm.options=-Xmx3g"
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Rename APK
        run: |
          set -euo pipefail
          mkdir -p release
          cp app/build/outputs/apk/debug/app-debug.apk release/MarketForecast_PROX_4.8.120.apk

      - name: Publish APK as GitHub Release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="build-${GITHUB_RUN_NUMBER}"
          TITLE="MarketForecast PROX 4.8.120 build ${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" release/MarketForecast_PROX_4.8.120.apk \
            --repo "$GITHUB_REPOSITORY" \
            --title "$TITLE" \
            --notes "Debug APK for MarketForecast PROX 4.8.120. Commit: ${GITHUB_SHA}"
