name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
  pull_request:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Locate Gradle project
        shell: bash
        run: |
          set -euo pipefail
          if [ -f "settings.gradle.kts" ]; then
            echo "Gradle project is already at repository root."
          else
            ZIP_FILE="$(find . -type f -iname '*.zip' -not -path './.git/*' -not -path './.mfp_unpack/*' -printf '%T@ %p\n' 2>/dev/null | sort -nr | cut -d' ' -f2- | head -n1 || true)"
            test -n "$ZIP_FILE" || { echo 'ERROR: Gradle project/ZIP not found.'; exit 1; }
            rm -rf .mfp_unpack
            mkdir -p .mfp_unpack
            unzip -q "$ZIP_FILE" -d .mfp_unpack
            SETTINGS="$(find .mfp_unpack -type f -name settings.gradle.kts -print -quit || true)"
            test -n "$SETTINGS" || { echo 'ERROR: ZIP does not contain settings.gradle.kts.'; exit 1; }
            PROJECT_ROOT="$(dirname "$SETTINGS")"
            cp -a "$PROJECT_ROOT"/. ./
            rm -rf .mfp_unpack
          fi
          test -f settings.gradle.kts
          test -f app/build.gradle.kts

      # The version is read from app/build.gradle.kts, so the workflow never
      # goes out of sync with the app (it used to hard-code 4.8.126 and fail).
      - name: Read app version
        id: ver
        shell: bash
        run: |
          set -euo pipefail
          NAME="$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts | head -n1)"
          CODE="$(grep -oP 'versionCode = \K[0-9]+' app/build.gradle.kts | head -n1)"
          test -n "$NAME" && test -n "$CODE"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "Building MarketForecast PROX $NAME ($CODE)"

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # Do not use android-actions/setup-android here. Its package installer can
      # request the obsolete SDK package named "tools" and fail before Gradle.
      - name: Prepare Android SDK
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          test -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" || {
            echo "ERROR: sdkmanager not found at $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
            exit 1
          }
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
          cache-read-only: false

      - name: Verify project structure
        shell: bash
        run: |
          set -euo pipefail
          test -f app/src/main/java/AnalyticsEngine.kt
          test -f app/src/main/java/Models.kt
          test -f app/src/main/AndroidManifest.xml
          grep -q 'longScore' app/src/main/java/Models.kt
          grep -q 'shortScore' app/src/main/java/Models.kt
          grep -q 'sampleSize' app/src/main/java/Models.kt
          grep -q 'fun backtest' app/src/main/java/AnalyticsEngine.kt
          test -f app/src/main/java/MarketScanner.kt
          test -f app/src/main/java/ScannerScreen.kt
          test -f app/src/main/java/InstrumentSearchEngine.kt
          test -f app/src/main/java/DesignSystem.kt
          test -f app/src/main/java/ScanWorker.kt
          test -f app/src/main/java/CandleChart.kt
          test -f app/src/main/java/Heatmap.kt
          test -f app/src/main/java/Confluence.kt
          test -f app/src/main/java/ReliabilityEngine.kt
          # The refresh token must only ever be touched through SecureTokenStore.
          ! grep -n 'bcs_refresh_token' app/src/main/java/MainActivity.kt app/src/main/java/MarketMonitorWorker.kt
          echo 'Project structure verification: OK'

      - name: Build debug APK
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4g -Dkotlin.daemon.jvm.options=-Xmx3g"
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      # The optimised build (R8): noticeably faster and smaller. If it ever fails, the debug APK is published instead.
      - name: Build release APK
        id: release
        continue-on-error: true
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4g -Dkotlin.daemon.jvm.options=-Xmx3g"
        run: gradle --no-daemon --stacktrace :app:assembleRelease

      - name: Rename APK
        run: |
          set -euo pipefail
          mkdir -p release
          NAME="MarketForecast_PROX_${{ steps.ver.outputs.name }}"
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk "release/${NAME}.apk"
            cp app/build/outputs/apk/debug/app-debug.apk "release/${NAME}_debug.apk"
          else
            echo "::warning::The release (R8) build failed, publishing the debug APK instead."
            cp app/build/outputs/apk/debug/app-debug.apk "release/${NAME}.apk"
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MarketForecast_PROX_${{ steps.ver.outputs.name }}
          path: release/*.apk
          if-no-files-found: error

      - name: Publish APK as GitHub Release asset
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="v${{ steps.ver.outputs.name }}-build${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" release/*.apk \
            --repo "$GITHUB_REPOSITORY" \
            --title "MarketForecast PROX ${{ steps.ver.outputs.name }} (build ${GITHUB_RUN_NUMBER})" \
            --notes "Debug APK. Commit: ${GITHUB_SHA}" \
            --prerelease
